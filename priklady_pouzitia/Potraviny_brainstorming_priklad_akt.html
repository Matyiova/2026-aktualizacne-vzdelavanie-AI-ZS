<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potraviny</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:'Monaco',monospace;background:#fdfdfd;color:#111} #export-page{width:100%;min-height:100vh;background:#fff;display:flex;flex-direction:column}.header{flex:0 0 auto;text-align:center;padding:12px 70px 10px;font-size:23px;line-height:1.18;font-weight:bold;background:#fff;border-bottom:2px solid #111;z-index:10}.meta{font-size:13px;font-weight:normal;color:#444;margin-top:5px;line-height:1.35}#canvas-area{position:relative;flex:1 1 auto;width:100%;min-height:760px;overflow:hidden;background:#fff}.main-topic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:var(--tema-font);color:var(--tema-color);background-color:var(--tema-bg);padding:12px 24px;border-radius:14px;border:3px solid #333;font-weight:bold;text-align:center;z-index:5;box-shadow:0 3px 9px rgba(0,0,0,.18);max-width:34vw;white-space:normal;overflow-wrap:anywhere;line-height:1.12}.concept{position:absolute;transform:translate(-50%,-50%);font-size:var(--concept-font,24px);padding:6px 9px;text-align:center;cursor:grab;z-index:2;max-width:220px;min-width:72px;white-space:normal;overflow-wrap:anywhere;line-height:1.13;background:rgba(255,255,255,.96);border-radius:10px;border:1px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.08);touch-action:none;user-select:none}.concept:hover{border-color:#777;z-index:30}.concept.dragging{cursor:grabbing;z-index:80;border-color:#008CBA;box-shadow:0 4px 12px rgba(0,0,0,.28)}.concept.manually-moved{border-color:#008CBA}.concept-text{display:block}.note-bubble{display:block;margin-top:6px;background:#fff;color:#000;font-size:20px;font-family:'Monaco',monospace;line-height:1.16;padding:5px 7px;border:1.5px solid #111;border-radius:8px;white-space:normal;overflow-wrap:anywhere;box-shadow:1px 1px 4px rgba(0,0,0,.18)}.note-link{width:2px;height:6px;margin:3px auto -2px;background:#111;display:block}.controls{position:fixed;bottom:16px;right:16px;z-index:100;display:flex;gap:10px;flex-wrap:wrap}.btn{font-family:'Monaco',monospace;padding:10px 16px;font-size:15px;color:#fff;border:none;border-radius:5px;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.25)}.btn-layout{background:#008CBA}.btn-save{background:#4CAF50}.btn-pdf{background:#f44336}.hint{position:fixed;left:16px;bottom:16px;z-index:90;background:rgba(255,255,255,.92);border:1px solid #aaa;border-radius:8px;padding:8px 10px;font-size:12px;color:#333}.pdf-freeze,.pdf-freeze *{transition:none!important;animation:none!important}@media print{.controls,.hint{display:none!important}#canvas-area{min-height:760px}}
</style>
</head>
<body>
<div id="export-page"><div class="header" id="page-header"></div><div id="canvas-area"><div class="main-topic" id="main-topic"></div></div></div>
<div class="hint" id="hint">Tip: pojem presuniete potiahnutím myšou. Kliknutím pridáte/upravíte poznámku.</div>
<div class="controls" id="controls">
  <button class="btn btn-layout" onclick="shuffleLayout()">Upraviť rozloženie</button>
  <button class="btn btn-save" onclick="saveProgressAsHTML()">Uložiť rozpracované cvičenie ako súbor HTML</button>
  <button class="btn btn-pdf" onclick="saveAsPDF()">Uložiť obrázok ako PDF</button>
</div>
<script>
const DATA={"nazov":"Potraviny","autor":"Mgr. Erika Matyiová","rok":"2026","predmet":"Nemecký jazyk","trieda":"VIII. B","tema":"Obst und Gemüse","tema_velkost":"50","tema_farba":"#000000","tema_pozadie":"#ffef42","concepts":["<span style='background-color:lightpink'>Orange<\/span>","<span style='background-color:lightpink'>Karotte<\/span>","<span style='background-color:lightpink'>Kartoffel<\/span>","<span style='background-color:lightpink'>Tomate<\/span>","<span style='background-color:lightpink'>Birne<\/span>","<span style='background-color:lightblue'>Apfel<\/span>","<span style='background-color:lightblue'>Knoblauch<\/span>","<span style='background-color:lightblue'>Pfirsich<\/span>","<span style='background-color:lightpink'>Erbse<\/span>","<span style='background-color:lightpink'>Bohne<\/span>","<span style='background-color:lightpink'>Banane<\/span>","<span style='background-color:lightpink'>Erdbeere<\/span>","<span style='background-color:lightpink'>Himbeere<\/span>","<span style='background-color:lightpink'>Kirsche<\/span>","<span style='background-color:yellow'>Radieschen<\/span>","<span style='background-color:lightblue'>Kohl<\/span>","<span style='background-color:lightpink'>schwarze<br> Johannisbeere<\/span>","<span style='background-color:lightpink'>rote<br> Johannisbeere<\/span>","<span style='background-color:lightpink'>weiße<br> Johannisbeere<\/span>","<span style='background-color:lightblue'>Paprika<\/span>"],"safeName":"Potraviny"}; let layoutSeed=0; const canvas=document.getElementById('canvas-area'), header=document.getElementById('page-header'), mainTopic=document.getElementById('main-topic');
let drag=null;
function text(v){return String(v||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function initPage(){document.documentElement.style.setProperty('--tema-font',Math.max(24,Math.min(parseInt(DATA.tema_velkost||'50',10)||50,82))+'px');document.documentElement.style.setProperty('--tema-color',DATA.tema_farba||'#000');document.documentElement.style.setProperty('--tema-bg',DATA.tema_pozadie||'#fff');header.innerHTML=text(DATA.nazov||'Brainstorming')+'<div class="meta">Predmet: '+text(DATA.predmet)+' &nbsp;|&nbsp; Trieda: '+text(DATA.trieda)+' &nbsp;|&nbsp; Autor: '+text(DATA.autor)+' ('+text(DATA.rok)+')</div>';mainTopic.textContent=DATA.tema||'Téma';DATA.concepts.forEach((html,index)=>{const el=document.createElement('div');el.className='concept';el.dataset.index=index;el.innerHTML='<span class="concept-text">'+html+'</span>';el.addEventListener('pointerdown',startDrag);canvas.appendChild(el);});}
function rectsOverlap(a,b,gap){return !(a.right+gap<b.left||a.left>b.right+gap||a.bottom+gap<b.top||a.top>b.bottom+gap)} function inside(r,w,h,pad){return r.left>=pad&&r.top>=pad&&r.right<=w-pad&&r.bottom<=h-pad} function getRectAt(el,x,y){const w=el.offsetWidth,h=el.offsetHeight;return{left:x-w/2,top:y-h/2,right:x+w/2,bottom:y+h/2}} function currentCenterRect(){const c=mainTopic.getBoundingClientRect(),a=canvas.getBoundingClientRect();return{left:c.left-a.left,top:c.top-a.top,right:c.right-a.left,bottom:c.bottom-a.top}}
function layoutConcepts(){const all=Array.from(document.querySelectorAll('.concept'));const count=all.length;const baseFont=count>36?18:count>28?19:count>20?21:24;document.documentElement.style.setProperty('--concept-font',baseFont+'px');canvas.style.minHeight=Math.max(720,window.innerHeight-header.offsetHeight,Math.ceil(count/10)*118+470)+'px';const w=canvas.clientWidth,h=canvas.clientHeight,cx=w/2,cy=h/2,pad=14,gap=8;const placed=[currentCenterRect()];const manual=all.filter(el=>el.dataset.manual==='1'), auto=all.filter(el=>el.dataset.manual!=='1');manual.forEach(el=>{let x=parseFloat(el.style.left)||cx,y=parseFloat(el.style.top)||cy;const r0=getRectAt(el,x,y);x=Math.max(pad+r0.right-x,Math.min(w-pad-(x-r0.left),x));y=Math.max(pad+r0.bottom-y,Math.min(h-pad-(y-r0.top),y));el.style.left=x+'px';el.style.top=y+'px';placed.push(getRectAt(el,x,y));});auto.forEach(el=>{el.style.left='-5000px';el.style.top='-5000px';});const maxRx=w/2-130,maxRy=h/2-80;auto.forEach((el,i)=>{let best=null;const baseAngle=-Math.PI/2+(i/Math.max(1,auto.length))*Math.PI*2+layoutSeed*.47;const rings=[.34,.44,.54,.64,.74,.84,.94];for(const ring of rings){const tries=Math.max(28,count*2);for(let t=0;t<tries;t++){const side=t%2===0?1:-1,step=Math.ceil(t/2),angle=baseAngle+side*step*(Math.PI/Math.max(10,count));const x=cx+Math.cos(angle)*maxRx*ring,y=cy+Math.sin(angle)*maxRy*ring,r=getRectAt(el,x,y);if(!inside(r,w,h,pad))continue;if(placed.every(p=>!rectsOverlap(r,p,gap))){best={x,y,r};break;}}if(best)break;}if(!best){const cols=Math.max(4,Math.floor(w/230));const rowH=82+Math.min(80,el.offsetHeight);for(let row=0;row<30&&!best;row++){for(let col=0;col<cols&&!best;col++){const x=pad+105+col*((w-2*pad-210)/Math.max(1,cols-1)),y=pad+62+row*rowH,r=getRectAt(el,x,y);if(inside(r,w,h,pad)&&placed.every(p=>!rectsOverlap(r,p,gap)))best={x,y,r};}}}if(!best){const y=h+60+i*78;canvas.style.minHeight=(y+130)+'px';best={x:cx,y,r:getRectAt(el,cx,y)}}el.style.left=best.x+'px';el.style.top=best.y+'px';placed.push(best.r);});}
function shuffleLayout(){layoutSeed++;document.querySelectorAll('.concept').forEach(el=>{delete el.dataset.manual;el.classList.remove('manually-moved')});requestAnimationFrame(layoutConcepts)}
function startDrag(e){if(e.button!==0)return;const el=e.currentTarget;const area=canvas.getBoundingClientRect();const x=parseFloat(el.style.left)||0,y=parseFloat(el.style.top)||0;drag={el,startX:e.clientX,startY:e.clientY,origX:x,origY:y,moved:false};el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.addEventListener('pointermove',moveDrag);el.addEventListener('pointerup',endDrag);el.addEventListener('pointercancel',endDrag);}
function moveDrag(e){if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;const r=canvas.getBoundingClientRect(),el=drag.el;const halfW=el.offsetWidth/2,halfH=el.offsetHeight/2;let x=drag.origX+dx,y=drag.origY+dy;x=Math.max(14+halfW,Math.min(r.width-14-halfW,x));y=Math.max(14+halfH,Math.min(r.height-14-halfH,y));el.style.left=x+'px';el.style.top=y+'px';}
function endDrag(e){if(!drag)return;const el=drag.el;el.classList.remove('dragging');el.releasePointerCapture?.(e.pointerId);el.removeEventListener('pointermove',moveDrag);el.removeEventListener('pointerup',endDrag);el.removeEventListener('pointercancel',endDrag);if(drag.moved){el.dataset.manual='1';el.classList.add('manually-moved');}else{addNote(el);}drag=null;}
function addNote(element){let existing=element.querySelector('.note-bubble');const oldText=existing?existing.textContent.trim():'';const note=prompt('Zadajte poznámku k pojmu:',oldText);if(note!==null&&note.trim()!==''){if(!existing){const link=document.createElement('span');link.className='note-link';element.appendChild(link);existing=document.createElement('span');existing.className='note-bubble';element.appendChild(existing);}existing.textContent=note.trim();requestAnimationFrame(layoutConcepts);}else if(note!==null&&note.trim()===''&&existing){const link=element.querySelector('.note-link');if(link)link.remove();existing.remove();requestAnimationFrame(layoutConcepts);}}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function saveAsPDF(){const controls=document.getElementById('controls'),hint=document.getElementById('hint'),page=document.getElementById('export-page');const oldC=controls.style.display,oldH=hint.style.display;controls.style.display='none';hint.style.display='none';await wait(160);const pageWidth=Math.ceil(page.getBoundingClientRect().width),pageHeight=Math.ceil(page.scrollHeight);const oldPW=page.style.width,oldPMH=page.style.minHeight,oldCW=canvas.style.width,oldCMH=canvas.style.minHeight;page.classList.add('pdf-freeze');page.style.width=pageWidth+'px';page.style.minHeight=pageHeight+'px';canvas.style.width=Math.ceil(canvas.getBoundingClientRect().width)+'px';canvas.style.minHeight=Math.ceil(canvas.getBoundingClientRect().height)+'px';await wait(80);const opt={margin:0,filename:'Snimka_'+DATA.safeName+'.pdf',image:{type:'jpeg',quality:1},html2canvas:{scale:2,useCORS:true,scrollX:0,scrollY:0,width:pageWidth,height:pageHeight,windowWidth:pageWidth,windowHeight:pageHeight},jsPDF:{unit:'px',format:[pageWidth,pageHeight],orientation:pageWidth>=pageHeight?'landscape':'portrait'}};html2pdf().set(opt).from(page).save().then(()=>{page.classList.remove('pdf-freeze');page.style.width=oldPW;page.style.minHeight=oldPMH;canvas.style.width=oldCW;canvas.style.minHeight=oldCMH;controls.style.display=oldC||'flex';hint.style.display=oldH||'block';}).catch(err=>{page.classList.remove('pdf-freeze');page.style.width=oldPW;page.style.minHeight=oldPMH;canvas.style.width=oldCW;canvas.style.minHeight=oldCMH;controls.style.display=oldC||'flex';hint.style.display=oldH||'block';alert('PDF sa nepodarilo uložiť. Skúste to, prosím, znova.');console.error(err);});}

function saveProgressAsHTML() {
  document.body.setAttribute('data-restored', 'true');
  const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Rozpracovane_' + DATA.safeName + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  document.body.removeAttribute('data-restored');
}

const isRestored = document.body.hasAttribute('data-restored');
if (!isRestored) {
  initPage();
  window.addEventListener('load', () => { layoutConcepts(); setTimeout(layoutConcepts, 150); });
} else {
  document.querySelectorAll('.concept').forEach(el => el.addEventListener('pointerdown', startDrag));
}
window.addEventListener('resize', layoutConcepts);
</script>
</body></html>
