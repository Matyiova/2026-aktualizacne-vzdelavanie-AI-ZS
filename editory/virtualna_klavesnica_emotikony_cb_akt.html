<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<title>Virtuálna klávesnica s emotikonmi</title>
<style>
  body { font-family: Courier bold, monospace; padding: 20px; background-color: #f4f4f4; }
  h1 { text-align: center; }
  
  /* Štýl pre textové pole */
  textarea { 
    width: 100%; 
    max-width: 800px;
    height: 150px; 
    font-size: 150%; 
    margin-bottom: 20px; 
    padding: 10px;
    box-sizing: border-box;
    display: block;
    margin-left: auto;
    margin-right: auto;
    color: #000;
    /* Vynútenie bezfarebného režimu pre všetky emotikony v prehliadači */
    filter: grayscale(100%);
  }

  /* Kontajner pre celú klávesnicu */
  .keyboard-container {
    max-width: 800px;
    margin: 0 auto;
    background: #fff;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  /* Štýly pre záložky (ušká) */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
    border-bottom: 2px solid #ddd;
    padding-bottom: 5px;
  }

  .tab-btn {
    padding: 8px 12px;
    cursor: pointer;
    background: #e0e0e0;
    border: 1px solid #ccc;
    border-bottom: none;
    border-radius: 5px 5px 0 0;
    font-family: Courier bold, monospace;
    font-weight: bold;
    flex-grow: 1;
    text-align: center;
  }

  .tab-btn:hover {
    background-color: #d0d0d0;
  }

  .tab-btn.active {
    background-color: #fff;
    border-bottom: 2px solid #fff;
    margin-bottom: -7px;
    z-index: 10;
    font-weight: bold;
    color: #000;
  }

  /* Obsah kategórií */
  .category-content {
    display: none;
    padding: 10px 0;
    min-height: 200px;
  }

  .category-content.active {
    display: block;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Klávesy */
  .keyboard-row { display: flex; gap: 5px; justify-content: center; margin-bottom: 5px; flex-wrap: wrap; }
  
  button.key {
    padding: 10px;
    font-family: 'Segoe UI Symbol', 'Noto Sans Symbols', 'Arial Unicode MS', Courier, monospace;
    font-size: 160%;
    min-width: 50px;
    height: 50px;
    cursor: pointer;
    background: #f9f9f9;
    border: 1px solid #999;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    /* Vynútenie bezfarebného režimu priamo na tlačidlách klávesnice */
    filter: grayscale(100%);
  }

  button.key:active {
    background: #ddd;
  }

  /* Funkčné klávesy dole */
  .function-bar {
    margin-top: 20px;
    border-top: 2px solid #ddd;
    padding-top: 10px;
  }

  button.func-key {
    font-size: 100%;
    min-width: 80px;
    font-weight: bold;
    background-color: #e8e8e8;
    filter: none;
  }
  
  button.backspace {
      background-color: #ffdddd;
  }
</style>

<script>
 const textarea = document.getElementById('textInput');
 const keys = document.querySelectorAll('.key[data-char]');

 /*
   FE0E = textový/bezfarebný variant emoji
   FE0F = farebný emoji variant
 */
 function makeTextEmoji(char) {
   if (!char) return '';

   // Odstráni farebný variant, ak je súčasťou znaku
   char = char.replace(/\uFE0F/g, '');

   // Ak už obsahuje textový variant, necháme ho
   if (char.includes('\uFE0E')) {
     return char;
   }

   // Pridá textový variant pre zobrazenie na webe
   return char + '\uFE0E';
 }

 // Bezpečné escapovanie HTML pri kopírovaní
 function escapeHtml(text) {
   return text
     .replace(/&/g, '&amp;')
     .replace(/</g, '&lt;')
     .replace(/>/g, '&gt;')
     .replace(/"/g, '&quot;')
     .replace(/'/g, '&#039;');
 }

 // Pri načítaní stránky upraví symboly na tlačidlách na textový/bezfarebný variant
 window.addEventListener('DOMContentLoaded', () => {
   keys.forEach(key => {
     const original = key.getAttribute('data-char');
     const textEmoji = makeTextEmoji(original);
     key.setAttribute('data-char', textEmoji);
     key.textContent = textEmoji;
   });
 });

 // Prepínanie záložiek
 function openTab(evt, categoryName) {
   var i, tabcontent, tablinks;

   tabcontent = document.getElementsByClassName("category-content");
   for (i = 0; i < tabcontent.length; i++) {
     tabcontent[i].style.display = "none";
     tabcontent[i].classList.remove("active");
   }

   tablinks = document.getElementsByClassName("tab-btn");
   for (i = 0; i < tablinks.length; i++) {
     tablinks[i].className = tablinks[i].className.replace(" active", "");
   }

   document.getElementById(categoryName).style.display = "block";
   document.getElementById(categoryName).classList.add("active");
   evt.currentTarget.className += " active";
 }

 // Vkladanie textu na pozíciu kurzora
 function insertAtCursor(text) {
   const start = textarea.selectionStart;
   const end = textarea.selectionEnd;
   const before = textarea.value.substring(0, start);
   const after = textarea.value.substring(end);

   textarea.value = before + text + after;
   textarea.selectionStart = textarea.selectionEnd = start + text.length;
   textarea.focus();
 }

 // Vkladanie emotikonov
 keys.forEach(key => {
   key.addEventListener('click', () => {
     let char = key.getAttribute('data-char');
     char = makeTextEmoji(char);
     insertAtCursor(char);
   });
 });

 // Mazanie pred kurzorom
 function deleteBeforeCursor() {
   const start = textarea.selectionStart;
   const end = textarea.selectionEnd;

   if (start !== end) {
     textarea.value = textarea.value.substring(0, start) + textarea.value.substring(end);
     textarea.selectionStart = textarea.selectionEnd = start;
     textarea.focus();
     return;
   }

   if (start === 0) {
     textarea.focus();
     return;
   }

   const before = textarea.value.substring(0, start);
   const after = textarea.value.substring(end);
   let chars = Array.from(before);

   if (chars.length > 0 && chars[chars.length - 1] === '\uFE0E') {
     chars.pop();
     if (chars.length > 0) {
       chars.pop();
     }
   } else {
     chars.pop();
   }

   const newBefore = chars.join('');
   textarea.value = newBefore + after;
   textarea.selectionStart = textarea.selectionEnd = newBefore.length;
   textarea.focus();
 }

 // Záložné kopírovanie
 function fallbackCopyHtml(htmlText, plainText) {
   const container = document.createElement('div');
   container.setAttribute('contenteditable', 'true');
   container.style.position = 'fixed';
   container.style.left = '-9999px';
   container.style.top = '0';
   container.innerHTML = htmlText;
   document.body.appendChild(container);

   const range = document.createRange();
   range.selectNodeContents(container);

   const selection = window.getSelection();
   selection.removeAllRanges();
   selection.addRange(range);

   let successful = false;
   try {
     successful = document.execCommand('copy');
   } catch (err) {
     successful = false;
   }

   selection.removeAllRanges();
   document.body.removeChild(container);

   if (!successful) {
     // fallback pre obyčajný text, ak html zlyhá
     const tempTextArea = document.createElement("textarea");
     tempTextArea.value = plainText;
     document.body.appendChild(tempTextArea);
     tempTextArea.select();
     document.execCommand('copy');
     document.body.removeChild(tempTextArea);
   }
 }

 // Backspace
 document.getElementById('backspace').addEventListener('click', () => {
   deleteBeforeCursor();
 });

 // Medzera
 document.getElementById('space').addEventListener('click', () => {
   insertAtCursor(' ');
 });

 // Kopírovanie do schránky (s odstránením znakov pre štvorčeky)
 document.getElementById('copy').addEventListener('click', async () => {
   
   // Dôležitá zmena: Pred kopírovaním vymažeme neviditeľný znak \uFE0E, 
   // aby sa vo Worde nezobrazovali hrubé prázdne štvorčeky
   const textToCopy = textarea.value.replace(/\uFE0E/g, '');

   // V HTML pre schránku voláme primárne natívny font Segoe UI Emoji
   const htmlText =
     '<div style="font-family: \'Segoe UI Emoji\', Arial, sans-serif; color: #000000; font-size: 18pt;">'
     + escapeHtml(textToCopy).replace(/\n/g, '<br>')
     + '</div>';

   try {
     if (navigator.clipboard && window.ClipboardItem && window.isSecureContext) {
       const clipboardItem = new ClipboardItem({
         'text/plain': new Blob([textToCopy], { type: 'text/plain' }),
         'text/html': new Blob([htmlText], { type: 'text/html' })
       });
       await navigator.clipboard.write([clipboardItem]);
     } else {
       fallbackCopyHtml(htmlText, textToCopy);
     }

     alert('Text bol úspešne skopírovaný. V editore sa zobrazí už bez štvorčekov.');
   } catch (err) {
     fallbackCopyHtml(htmlText, textToCopy);
     alert('Text bol úspešne skopírovaný. V editore sa zobrazí už bez štvorčekov.');
   }
 });

 // Vymazanie všetkého
 document.getElementById('clear').addEventListener('click', () => {
   if (confirm("Naozaj chcete vymazať celý text?")) {
     textarea.value = '';
     textarea.focus();
   }
 });
</script>
