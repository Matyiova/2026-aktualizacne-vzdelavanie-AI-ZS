<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8"/>
<title>Virtuálna klávesnica - emotikony</title>
<style>
  body { font-family: Courier bold, monospace; padding: 20px; }
  textarea { width: 100%; height: 150px; font-size: 150%; margin-bottom: 20px; }
  .keyboard { font-family: Courier bold, monospace; display: flex; flex-direction: column; gap: 5px; }
  .row { display: flex; gap: 5px; }
  button.key {
    padding: 10px 15px;
    font-family: 'Segoe UI Emoji', 'Apple Color Emoji', Courier bold, monospace; /* Pridané fonty pre lepšie zobrazenie emotikonov */
    font-size: 150%;
    font-weight: bold;
    min-width: 45px;
    cursor: pointer;
  }
  /* Mierne širšie tlačidlá pre funkčné klávesy */
  #space, #copy, #clear, #backspace {
      min-width: 80px;
  }
</style>
</head>
<body>
<h1>Virtuálna klávesnica na vkladanie emotikonov</h1>
<center>
<textarea id="textInput" placeholder="Píšte alebo vkladajte emotikony sem."></textarea>
<div class="keyboard" id="keyboard">

<div class="keyboard-row">
<button class="key" data-char="🙂">🙂</button>
<button class="key" data-char="😀">😀</button>
<button class="key" data-char="😉">😉</button>
<button class="key" data-char="😍">😍</button>
<button class="key" data-char="😂">😂</button>
<button class="key" data-char="😎">😎</button>
<button class="key" data-char="🤔">🤔</button>
<button class="key" data-char="☹">☹</button>
<button class="key" data-char="😢">😢</button>
<button class="key" data-char="😠">😠</button>
</div>

<div class="keyboard-row">
<button class="key" data-char="🍀">🍀</button>
<button class="key" data-char="🌷">🌷</button>
<button class="key" data-char="🌼">🌼</button>
<button class="key" data-char="🌻">🌻</button>
<button class="key" data-char="🌺">🌺</button>
<button class="key" data-char="🌹">🌹</button>
<button class="key" data-char="🌸">🌸</button>
<button class="key" data-char="🌲">🌲</button>
<button class="key" data-char="🌵">🌵</button>
<button class="key" data-char="🍁">🍁</button>
</div>

<div class="keyboard-row">
<button class="key" data-char="❤️">❤️</button>
<button class="key" data-char="🧡">🧡</button>
<button class="key" data-char="🐶">🐶</button>
<button class="key" data-char="🐱">🐱</button>
<button class="key" data-char="🐭">🐭</button>
<button class="key" data-char="🦊">🦊</button>
<button class="key" data-char="🐻">🐻</button>
<button class="key" data-char="🐼">🐼</button>
<button class="key" data-char="🦁">🦁</button>
<button class="key" data-char="🦄">🦄</button>
</div>

<div class="keyboard-row">
<button class="key" data-char="👍">👍</button>
<button class="key" data-char="👎">👎</button>
<button class="key" data-char="👌">👌</button>
<button class="key" data-char="👋">👋</button>
<button class="key" data-char="👏">👏</button>
<button class="key" data-char="🙌">🙌</button>
<button class="key" data-char="🙏">🙏</button>
<button class="key" data-char="💪">💪</button>
<button class="key" data-char="✨">✨</button>
<button class="key" id="backspace">⌫</button>
</div>

<div class="keyboard-row">
<button class="key" data-char="⭐">⭐</button>
<button class="key" data-char="☀️">☀️</button>
<button class="key" data-char="☁️">☁️</button>
<button class="key" data-char="❄️">❄️</button>
<button class="key" data-char="🔥">🔥</button>
<button class="key" data-char="💧">💧</button>
<button class="key" data-char="🌈">🌈</button>
<button class="key" data-char="🎉">🎉</button>
<button class="key" data-char="🎁">🎁</button>
<button class="key" data-char="☕">☕</button>
</div>

<div class="keyboard-row">
<button class="key" id="space">Medzera</button>
<button class="key" id="copy">Kopírovať</button>
<button class="key" id="clear">Vymazať</button>
</div>
</div>
</center>
<script>
  const textarea = document.getElementById('textInput');
  const keys = document.querySelectorAll('.key[data-char]');

  // Funkcia na vloženie znaku na pozíciu kurzora
  function insertAtCursor(text) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const before = textarea.value.substring(0, start);
    const after = textarea.value.substring(end);
    textarea.value = before + text + after;
    textarea.selectionStart = textarea.selectionEnd = start + text.length;
    textarea.focus();
  }

  // Priradenie udalostí pre klávesy s emotikonmi
  keys.forEach(key => {
    key.addEventListener('click', () => {
      let char = key.getAttribute('data-char');
      insertAtCursor(char);
    });
  });

  // Backspace - mazanie
  document.getElementById('backspace').addEventListener('click', () => {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    
    if (start === end && start > 0) {
      // Ak nie je označený text, zmaže znak pred kurzorom
      // Emoji môžu byť zložené z viacerých "code units", ale moderné prehliadače to väčšinou zvládajú cez slice dobre.
      // Pre robustnejšie mazanie emoji by sa dalo použiť Intl.Segmenter, ale držíme sa pôvodnej logiky.
      textarea.value = textarea.value.slice(0, start - 1) + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start - 1;
    } else {
      // Ak je označený text, zmaže výber
      textarea.value = textarea.value.slice(0, start) + textarea.value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start;
    }
    textarea.focus();
  });

  // Medzera
  document.getElementById('space').addEventListener('click', () => {
    insertAtCursor(' ');
  });

  // Kopírovanie do schránky
  document.getElementById('copy').addEventListener('click', () => {
    textarea.select();
    document.execCommand('copy');
    // Voliteľné: vizuálna spätná väzba (napr. alert), tu vynechaná podľa vzoru
  });

  // Vymazanie celého obsahu
  document.getElementById('clear').addEventListener('click', () => {
    textarea.value = '';
    textarea.focus();
  });
</script>
<br><br>
  <b>Spracovala pomocou UI:</b> Mgr. Erika Matyiová (2025/2026)
<br><br>
</body>
</html>
